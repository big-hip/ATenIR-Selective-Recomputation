# Legacy capture-only sample.
#
# Current main workflow uses `input.yaml` as the single default config.
# This file is kept only as a minimal capture-specific example and is NOT
# referenced by default entrypoints.

version: 1

run:
  task: capture

env:
  model_name: Transformer
  recompute:
    "7": 1.0
  recompute_log_level: INFO

capture:
  mode: static
  batch_size: 2
  seq_len: 32
  dynamic: false
  static_profile: fast
  compare_runtime: false

# If you do not need a separate capture-only sample anymore,
# this file can be removed in a later cleanup pass.
