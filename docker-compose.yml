services:
  atenir:
    build: .
    image: atenir-selective-recomputation
    container_name: atenir

    # GPU 支持（需要 NVIDIA Container Toolkit）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # 实验输出映射到宿主机
    volumes:
      - ./toolkit_examples/outputs:/workspace/ATenIR-Selective-Recomputation/toolkit_examples/outputs

    # 共享内存（PyTorch DataLoader 多进程需要）
    shm_size: "4g"
